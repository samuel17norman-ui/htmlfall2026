<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Remember the titans Poster">
  <meta name="robots" content="noindex, nofollow">
  <title>Remember the Titans</title>
  <!--Poster Fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Oswald:wght@200..700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <section class="Poster">
        <!--code for Image-->
        <img src="./img/TitansPoster.png" alt="Titans" class="Poster-Image">
        <!--header for actors name that was at the top of the orginal poster-->
        <header>
            <h1 class="Head">Denzel Washington</h1>
        </header>

        <div class="Info">
        <!--This will be where all the movie info will be-->
        <div class="Quote">
            <p>History</p>
            <p>is written by winners</p>
        </div>

        <div class="Disney">
            <p>Walt Disney Pictures</p>
        </div>

        <div class="Title">
            <h2> Remember The <br> Titans</h2>
        </div>

        <!--code for credits-->
        <div class="Credits">
            <p>Walt Disney pictures presents <br> A Jerry Bruckheimer Production</p>
            <p>A Boaz Yakin Film Denzel Wasington Will Patton Wood Harris</p>
        </div>

        <!--Links-->
        <nav>
            <a href="https://movies.disney.com/remember-the-titans">
                Movie Page
            </a>
        </nav>

    </div>
    
        </section>
    </main>
</body>
